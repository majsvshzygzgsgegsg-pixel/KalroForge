<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ForgePilot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="mark">F</span><span>ForgePilot</span></div>
      <button id="new-chat" class="new-chat">＋ New session</button>
      <div class="section-label">Local sessions</div>
      <nav id="sessions" aria-label="Saved sessions"></nav>
      <div class="server-card">
        <span id="server-dot" class="dot"></span>
        <div><strong id="server-state">Connecting</strong><small id="server-detail">Local server</small></div>
      </div>
    </aside>
    <main>
      <header>
        <div><h1 id="chat-title">New session</h1><p id="model-label">Loading model…</p></div>
        <div id="run-state" class="run-state">Ready</div>
      </header>
      <section id="messages" class="messages" aria-live="polite">
        <div id="welcome" class="welcome">
          <div class="hero-mark">F</div>
          <h2>What should we build?</h2>
          <p>ForgePilot runs locally, keeps credentials on the server, and asks before risky tools act.</p>
          <div class="suggestions">
            <button data-prompt="Inspect this project and explain its architecture.">Explain this project</button>
            <button data-prompt="Find likely bugs, propose fixes, and wait for approval before editing.">Review for bugs</button>
            <button data-prompt="Check Git status and summarize the current changes.">Inspect Git changes</button>
          </div>
        </div>
      </section>
      <section id="approval" class="approval hidden" aria-live="assertive">
        <div><strong>Approval required</strong><p id="approval-text"></p></div>
        <button id="reject" class="secondary">Reject</button><button id="approve">Approve once</button>
      </section>
      <form id="composer">
        <textarea id="prompt" rows="1" placeholder="Message ForgePilot…" aria-label="Message"></textarea>
        <button id="send" type="submit" aria-label="Send">↑</button>
        <div class="composer-meta"><span>Enter to send · Shift+Enter for newline</span><span id="workspace"></span></div>
      </form>
    </main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
