[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "kairoforge-runtime-bin"
version = "0.0.0.dev0"
description = "Bundled dsh CLI runtime for the KairoForge Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "DeepSeek" }]

[project.urls]
Homepage = "https://github.com/deepseek-ai/kairoforge"
Documentation = "https://github.com/deepseek-ai/kairoforge/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/deepseek-ai/kairoforge/issues"
Source = "https://github.com/deepseek-ai/kairoforge"

[project.scripts]
dsh = "kairoforge_runtime:main"

# Include the injected dsh executable and sidecars; exclude the dev-only node closure.
[tool.hatch.build]
artifacts = [
  "src/kairoforge_runtime/runtime/kairoforge-sdk-runtime-*",
  "src/kairoforge_runtime/runtime/kairoforge-sdk-runtime-*/**",
  "src/kairoforge_runtime/runtime/linux-*/**",
  "src/kairoforge_runtime/runtime/macos-*/**",
  "src/kairoforge_runtime/runtime/win-*/**",
]
exclude = ["src/kairoforge_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/kairoforge_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
